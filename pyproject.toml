[build-system]
requires = ["setuptools>=77", "cffi"]
build-backend = "setuptools.build_meta"

[project]
name = "leptris"
version = "1.25.1"
description = "Python bindings for libleptris — fast XML 1.0 parsing and XPath 1.0, shaped like lxml"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ribose" }]
keywords = ["xml", "xpath", "parser", "lxml", "ffi", "cffi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Text Processing :: Markup :: XML",
    "Typing :: Typed",
]
dependencies = ["cffi>=1.0"]

[project.urls]
Homepage = "https://github.com/leptris/leptris-py"
Repository = "https://github.com/leptris/leptris-py"
Changelog = "https://github.com/leptris/leptris-py/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest"]
bench = ["lxml"]

[tool.setuptools]
packages = ["leptris"]

[tool.setuptools.package-data]
leptris = ["py.typed"]

[tool.setuptools.exclude-package-data]
leptris = ["*.c"]
