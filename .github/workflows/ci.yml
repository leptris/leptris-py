name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # github.ref is refs/pull/N/merge per PR (unique) and refs/heads/X
  # per branch — head_ref-based keys collided across forks using the
  # same branch name and cancelled each other's runs
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  future-python:
    # TODO.native/13: forward-compat canary — the cp39-abi3 wheels
    # must load on future CPython by design; prove it at the
    # earliest available pre-release. Expected red until APIs
    # settle; never gates the merge.
    name: pytest (ubuntu, 3.15 canary)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15.0-alpha.3"
      - name: Build libleptris from the pinned release tarball
        shell: bash
        run: |
          set -e
          LIBLEPTRIS_VERSION=$(cat libleptris-version.txt)
          mkdir -p tmp/libleptris && cd tmp/libleptris
          curl -sL "https://codeload.github.com/leptris/leptris/tar.gz/refs/tags/v${LIBLEPTRIS_VERSION}" | tar xz --strip-components=1
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DLEPTRIS_BUILD_SHARED=ON -DLEPTRIS_BUILD_STATIC=OFF \
            -DBUILD_TESTING=OFF -DLEPTRIS_BUILD_CLI=OFF \
            -DLEPTRIS_BUILD_BENCHMARKS=OFF \
            -DLEPTRIS_ENABLE_UTF8PROC=OFF -DLEPTRIS_ENABLE_ICONV=OFF
          cmake --build build --config Release
          LIB=$(find build -type f -o -type l 2>/dev/null | grep -iE '(lib)?leptris\.(dylib|so|dll)$' | head -1)
          echo "LEPTRIS_LIB_PATH=$PWD/$LIB" >> "$GITHUB_ENV"
      - name: Install and test the binding
        shell: bash
        run: |
          # leptris-py#316: the floating pytest broke on 3.15.0-alpha
          # (frozendict NameError in pytest's own assertion import),
          # drowning the canary so it could not report OUR regressions.
          # Pin to the pytest line known green on this interpreter.
          python -m pip install "pytest<8.4" cffi setuptools
          python setup.py build_ext --inplace
          python -m pytest tests/ -q
        env:
          LEPTRIS_LIB_PATH: ${{ env.LEPTRIS_LIB_PATH }}

  freethreaded:
    # TODO.native/13: the cpXXt wheels ship under the
    # one-document-per-thread contract — this leg exercises that
    # contract on a real free-threaded interpreter.
    name: pytest (ubuntu, 3.14t free-threaded)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14t"
      - name: Build libleptris from the pinned release tarball
        shell: bash
        run: |
          set -e
          LIBLEPTRIS_VERSION=$(cat libleptris-version.txt)
          mkdir -p tmp/libleptris && cd tmp/libleptris
          curl -sL "https://codeload.github.com/leptris/leptris/tar.gz/refs/tags/v${LIBLEPTRIS_VERSION}" | tar xz --strip-components=1
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DLEPTRIS_BUILD_SHARED=ON -DLEPTRIS_BUILD_STATIC=OFF \
            -DBUILD_TESTING=OFF -DLEPTRIS_BUILD_CLI=OFF \
            -DLEPTRIS_BUILD_BENCHMARKS=OFF \
            -DLEPTRIS_ENABLE_UTF8PROC=OFF -DLEPTRIS_ENABLE_ICONV=OFF
          cmake --build build --config Release
          LIB=$(find build -type f -o -type l 2>/dev/null | grep -iE '(lib)?leptris\.(dylib|so|dll)$' | head -1)
          echo "LEPTRIS_LIB_PATH=$PWD/$LIB" >> "$GITHUB_ENV"
      - name: Install and test the binding
        shell: bash
        run: |
          python -m pip install pytest cffi setuptools
          python setup.py build_ext --inplace
          python -m pytest tests/ -q
        env:
          LEPTRIS_LIB_PATH: ${{ env.LEPTRIS_LIB_PATH }}

  test:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # every GitHub-hosted family: x86_64 + aarch64 linux,
        # arm64 + intel macos, amd64 windows
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build libleptris from the pinned release tarball
        shell: bash
        run: |
          set -e
          LIBLEPTRIS_VERSION=$(cat libleptris-version.txt)
          mkdir -p tmp/libleptris && cd tmp/libleptris
          curl -sL "https://api.github.com/repos/leptris/leptris/tarball/v${LIBLEPTRIS_VERSION}" | tar xz --strip-components=1
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DLEPTRIS_BUILD_SHARED=ON -DLEPTRIS_BUILD_STATIC=OFF \
            -DBUILD_TESTING=OFF -DLEPTRIS_BUILD_CLI=OFF \
            -DLEPTRIS_BUILD_BENCHMARKS=OFF \
            -DLEPTRIS_ENABLE_UTF8PROC=OFF -DLEPTRIS_ENABLE_ICONV=OFF
          cmake --build build --config Release
          LIB=$(find build -type f -o -type l 2>/dev/null | grep -iE '(lib)?leptris\.(dylib|so|dll)$' | head -1)
          if [ -z "$LIB" ]; then
            echo "ERROR: libleptris shared library not found"
            exit 1
          fi
          # _ffi.py's loader dlopens the FILE named by LEPTRIS_LIB_PATH.
          echo "LEPTRIS_LIB_PATH=$PWD/$LIB" >> "$GITHUB_ENV"
          echo "Built: $LIB"

      - name: FFI mirror drift gate
        shell: bash
        run: |
          LIBLEPTRIS_VERSION=$(cat libleptris-version.txt)
          python scripts/check_ffi_mirrors.py tmp/libleptris

      - name: Install and test the binding
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install .[test]
          # pytest imports the source tree from the checkout; the
          # accelerator must exist in place for the compiled surface
          # to be exercised.
          python setup.py build_ext --inplace
          echo "using lib at: $LEPTRIS_LIB_PATH"
          python -m pytest tests/ -q

  windows-native-ops:
    # leptris-py#306: serialbench gates xquery/xslt/xslt30/streaming off
    # on Windows for a reported "segfault inside the mingw wheel". Every
    # wheel ever shipped on PyPI is MSVC-built (verified back to the
    # first _vendor wheel, 1.9.278.0 — api-ms-win-crt/VCRUNTIME
    # signatures, zero GCC artifacts), and the release pipeline's own
    # win_amd64 leg already runs the full suite green. So the report's
    # premise needs evidence on BOTH remaining Windows paths:
    #  - wheel  — the artifact consumers actually install (PyPI),
    #             running the four-op repro script from #306; plus the
    #             GATE-ERA wheel 1.9.201.0 (newest published when the
    #             serialbench gate landed, 2026-09-18) to learn whether
    #             the report's crash ever existed on a shipped artifact;
    #  - mingw  — a full GCC build (MSYS2 mingw-w64 python + GCC-built
    #             engine DLL + GCC-built accel): the only Windows
    #             toolchain the engine's MSVC-only CI never covered.
    name: native-ops probe (windows, ${{ matrix.suite }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [wheel, wheel-gate-era-1.9.201.0, mingw]
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        if: matrix.suite == 'mingw'
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-pip

      - uses: actions/setup-python@v5
        if: matrix.suite != 'mingw'
        with:
          python-version: "3.x"

      - name: "Install the wheel and run the #306 repro"
        if: matrix.suite != 'mingw'
        shell: bash
        # Run from OUTSIDE the checkout: `import leptris` must resolve
        # to the installed wheel, not the source tree. -X faulthandler
        # prints the native fault site if the process still dies.
        env:
          # gate-era leg: the newest wheel published before the
          # serialbench gate commit (b06a511, 2026-09-18 15:48Z)
          PIN: ${{ matrix.suite == 'wheel' && 'leptris' || 'leptris==1.9.201.0' }}
        run: |
          set -e
          python -m pip install --only-binary :all: --upgrade "$PIN"
          mkdir -p "$RUNNER_TEMP/probe"
          cp tests/repro_windows_native_ops.py "$RUNNER_TEMP/probe/"
          cd "$RUNNER_TEMP/probe"
          python -X faulthandler repro_windows_native_ops.py

      - name: Build the pinned engine DLL with mingw GCC
        if: matrix.suite == 'mingw'
        shell: msys2 {0}
        run: |
          set -e
          LIBLEPTRIS_VERSION=$(cat libleptris-version.txt)
          mkdir -p tmp/libleptris && cd tmp/libleptris
          curl -sL "https://codeload.github.com/leptris/leptris/tar.gz/refs/tags/v${LIBLEPTRIS_VERSION}" | tar xz --strip-components=1
          # Same config the wheel's vendor script uses, minus the
          # MSVC-only -A: GCC/Ninja selects the host arch itself.
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLEPTRIS_BUILD_SHARED=ON -DLEPTRIS_BUILD_STATIC=OFF \
            -DBUILD_TESTING=OFF -DLEPTRIS_BUILD_CLI=OFF \
            -DLEPTRIS_BUILD_BENCHMARKS=OFF \
            -DLEPTRIS_ENABLE_UTF8PROC=OFF -DLEPTRIS_ENABLE_ICONV=OFF
          cmake --build build
          LIB=$(find build -name '*leptris.dll' | head -1)
          if [ -z "$LIB" ]; then
            echo "ERROR: engine DLL not found" >&2
            exit 1
          fi
          echo "LEPTRIS_LIB_PATH=$(cygpath -w "$PWD/$LIB")" >> "$GITHUB_ENV"

      - name: Build the binding with the mingw toolchain (GCC accel)
        if: matrix.suite == 'mingw'
        shell: msys2 {0}
        run: |
          set -e
          python -m pip install "setuptools>=77" cffi pytest wheel
          # build_with_engine would cmake-build the vendored source
          # again; LEPTRIS_LIB_PATH short-circuits it to the DLL above.
          python setup.py build_ext --inplace
          echo "using lib at: $LEPTRIS_LIB_PATH"

      - name: "Run the #306 repro + full suite (mingw)"
        if: matrix.suite == 'mingw'
        shell: msys2 {0}
        # PYTHONPATH=. — the script form puts only tests/ on sys.path,
        # so the checkout's leptris/ (with the inplace GCC accel)
        # must come in through the environment, as `python -m` would.
        run: |
          set -e
          PYTHONPATH=. python -X faulthandler tests/repro_windows_native_ops.py
          python -X faulthandler -m pytest tests/ -q
