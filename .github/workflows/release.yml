# PyPI release path for leptris. Trusted publishing (no stored
# credentials): configure on pypi.org → project leptris → Settings →
# Trusted Publisher → owner leptris, repository leptris-py, workflow
# .github/workflows/release.yml, no environment.
#
# Triggers:
#   - workflow_dispatch (manual: ships the version in pyproject.toml)
#   - workflow_call from leptris/leptris's release flow (publish: true),
#     which is how every libleptris release also ships the wheel.
#
# NOTE: github.event_name propagates from the CALLER through
# workflow_call — the release tag job runs on pull_request closed —
# so gates key on inputs.publish, never on event_name == 'workflow_call'.

name: Build and publish leptris

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      publish:
        description: 'Publish the wheel to PyPI (trusted publisher)'
        type: boolean
        default: false

permissions:
  id-token: write

jobs:
  test:
    name: leptris tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # SELF-CHECKOUT: as a workflow_call the default checkout is the
      # CALLER's repo (leptris/leptris) — where neither the binding
      # sources nor libleptris-version.txt exist (the wheel job died
      # on `cat: libleptris-version.txt: No such file or directory`).
      # Always check out THIS repository.
      - uses: actions/checkout@v4
        with:
          repository: leptris/leptris-py
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build libleptris from the pinned release tarball
        shell: bash
        run: |
          set -e
          LIBLEPTRIS_VERSION=$(cat libleptris-version.txt)
          mkdir -p tmp/libleptris && cd tmp/libleptris
          # codeload (not api.github.com): the API endpoint is
          # unauthenticated-rate-limited and 403s on shared runners.
          curl -sL "https://codeload.github.com/leptris/leptris/tar.gz/refs/tags/v${LIBLEPTRIS_VERSION}" | tar xz --strip-components=1
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DLEPTRIS_BUILD_SHARED=ON -DLEPTRIS_BUILD_STATIC=OFF \
            -DBUILD_TESTING=OFF -DLEPTRIS_BUILD_CLI=OFF \
            -DLEPTRIS_BUILD_BENCHMARKS=OFF \
            -DLEPTRIS_ENABLE_UTF8PROC=OFF -DLEPTRIS_ENABLE_ICONV=OFF
          cmake --build build --config Release
          LIB=$(find build -type f -o -type l 2>/dev/null | grep -iE '(lib)?leptris\.(dylib|so|dll)$' | head -1)
          # _ffi.py's loader dlopens the FILE named by LEPTRIS_LIB_PATH.
          echo "LEPTRIS_LIB_PATH=$PWD/$LIB" >> "$GITHUB_ENV"

      - name: Run the test suite
        shell: bash
        run: |
          python -m pip install pytest cffi setuptools
          python setup.py build_ext --inplace
          python -m pytest tests/ -q
        env:
          LEPTRIS_LIB_PATH: ${{ env.LEPTRIS_LIB_PATH }}

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cibw: "cp39-manylinux_x86_64"
            dist: manylinux-x86_64
            sdist: true
          - os: ubuntu-24.04-arm
            cibw: "cp39-manylinux_aarch64"
            dist: manylinux-aarch64
          - os: ubuntu-latest
            cibw: "cp39-musllinux_x86_64"
            dist: musllinux-x86_64
          - os: ubuntu-24.04-arm
            cibw: "cp39-musllinux_aarch64"
            dist: musllinux-aarch64
          - os: ubuntu-latest
            cibw: "cp39-manylinux_i686"
            dist: manylinux-i686
            archs_linux: "i686"
          - os: ubuntu-latest
            cibw: "cp39-musllinux_i686"
            dist: musllinux-i686
            archs_linux: "i686"
          - os: ubuntu-latest
            cibw: "cp39-musllinux_armv7l"
            dist: musllinux-armv7l
            archs_linux: "armv7l"
          - os: ubuntu-latest
            cibw: "cp39-manylinux_ppc64le"
            dist: manylinux-ppc64le
            archs_linux: "ppc64le"
          - os: ubuntu-latest
            cibw: "cp39-manylinux_s390x"
            dist: manylinux-s390x
            archs_linux: "s390x"
          - os: windows-latest
            cibw: "cp39-win32"
            dist: win-x86
            archs_win: "x86"
          - os: macos-latest
            cibw: "cp39-macosx*"
            dist: macos-universal
            archs: "x86_64 arm64"
          - os: windows-latest
            cibw: "cp39-win_amd64"
            dist: win-amd64
            archs_win: "AMD64"
          - os: windows-latest
            cibw: "cp39-win_arm64"
            dist: win-arm64
            archs_win: "ARM64"
          - os: ubuntu-latest
            cibw: "cp314t-manylinux_x86_64"
            dist: ft-manylinux-x86_64
            enable: "cpython-freethreading"
          - os: ubuntu-24.04-arm
            cibw: "cp314t-manylinux_aarch64"
            dist: ft-manylinux-aarch64
            enable: "cpython-freethreading"
          - os: ubuntu-latest
            cibw: "cp314t-musllinux_x86_64"
            dist: ft-musllinux-x86_64
            enable: "cpython-freethreading"
          - os: ubuntu-24.04-arm
            cibw: "cp314t-musllinux_aarch64"
            dist: ft-musllinux-aarch64
            enable: "cpython-freethreading"
          - os: macos-latest
            cibw: "cp314t-macosx*"
            archs: "x86_64 arm64"
            dist: ft-macos-universal
            enable: "cpython-freethreading"
          - os: windows-latest
            cibw: "cp314t-win_amd64"
            dist: ft-win-amd64
            archs_win: "AMD64"
            enable: "cpython-freethreading"
          - os: windows-latest
            cibw: "cp314t-win_arm64"
            dist: ft-win-arm64
            archs_win: "ARM64"
            enable: "cpython-freethreading"
    steps:
      # SELF-CHECKOUT: as a workflow_call the default checkout is the
      # CALLER's repo (leptris/leptris) — where neither the binding
      # sources nor libleptris-version.txt exist (the wheel job died
      # on `cat: libleptris-version.txt: No such file or directory`).
      # Always check out THIS repository.
      - uses: actions/checkout@v4
        with:
          repository: leptris/leptris-py
          ref: main

      # cross-arch Linux legs (i686/armv7l/ppc64le/s390x) build in
      # emulated containers; native legs are unaffected
      - name: Set up QEMU
        if: matrix.os == 'ubuntu-latest'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - uses: actions/setup-python@v5
        if: matrix.os != 'ubuntu-latest' || matrix.archs_linux != 'i686'
        with:
          python-version: "3.x"

      - name: Build sdist
        if: matrix.sdist
        run: |
          python -m pip install --upgrade build
          # The sdist bundles the pinned ENGINE SOURCE; binaries are
          # never included (MANIFEST prunes _vendor + vendor builds).
          bash scripts/prepare_sdist_vendor.sh
          rm -rf leptris/_vendor
          python -m build --sdist --outdir wheelhouse

      - name: Build wheels (cibuildwheel)
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_BUILD: ${{ matrix.cibw }}
          CIBW_ARCHS_MACOS: ${{ matrix.archs }}
          CIBW_ARCHS_WINDOWS: ${{ matrix.archs_win }}
          CIBW_ARCHS_LINUX: ${{ matrix.archs_linux }}
          CIBW_ENABLE: ${{ matrix.enable }}
          CIBW_BEFORE_ALL_LINUX: "bash scripts/vendor_libleptris.sh"
          CIBW_BEFORE_ALL_MACOS: "bash scripts/vendor_libleptris.sh"
          CIBW_BEFORE_ALL_WINDOWS: "bash scripts/vendor_libleptris.sh"
          CIBW_TEST_COMMAND: "python {project}/scripts/wheel_smoke.py"
        with:
          output-dir: wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: leptris-dist-${{ matrix.dist }}
          path: wheelhouse/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: inputs.publish == true || github.event_name == 'workflow_dispatch'
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: leptris-dist-*
          merge-multiple: true
          path: dist/

      - name: Publish to PyPI (trusted publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
